<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROOTLAB — bản thử v2: đổi người + 6 trang sản phẩm riêng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   ROOTLAB — BẢN THỬ v2
   • Màn đầu: rê chuột vào nhóm nào → ĐỔI NGƯỜI, có hiệu ứng nhiễu
   • Bấm → lướt xuống TRANG RIÊNG của nhóm đó (khác hẳn nhau)
   • Người hiện tại là HÌNH BÓNG MẪU. Thay ảnh thật: xem cuối file.
   ================================================================== */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#050b09;color:#f1f7f4;overflow-x:hidden;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.script{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:400}
.serif{font-family:"Playfair Display",Georgia,serif;font-weight:400}

.demo-flag{position:fixed;bottom:14px;left:14px;z-index:900;
  background:rgba(224,165,58,.14);border:1px solid rgba(224,165,58,.42);color:#e0a53a;
  padding:6px 12px;border-radius:999px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  backdrop-filter:blur(8px)}

/* ============ MÀN ĐẦU ============ */
.hero{position:relative;min-height:100svh;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(120% 92% at 50% 44%,#0b8a78 0%,#044e3b 32%,#011411 74%);
  transition:background 1s cubic-bezier(.2,.9,.25,1)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(74% 62% at 50% 46%,transparent 38%,rgba(1,20,17,.8) 100%)}

.brandbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;
  align-items:center;justify-content:space-between;padding:26px clamp(18px,4vw,52px)}
.brand{font-size:18px;letter-spacing:.34em;font-weight:500}
.brand small{display:block;font-size:8.5px;letter-spacing:.3em;opacity:.5;margin-top:5px;font-weight:400}
.brandbar .tag{font-size:10px;letter-spacing:.22em;opacity:.55;text-transform:uppercase}

.stage{position:relative;z-index:10;width:min(1240px,94vw);height:min(88svh,830px);
  display:grid;place-items:center}
.plate-wrap,#nodes{grid-area:1/1}
#nodes{position:relative;width:100%;height:100%;pointer-events:none}
#nodes .node{pointer-events:auto}

/* ---- KHUNG ẢNH NGƯỜI (chỗ đặt ảnh thật) ---- */
.plate-wrap{position:relative;display:grid;place-items:center}
.plate{position:relative;width:min(42vw,440px);aspect-ratio:765/890;border-radius:210px 210px 18px 18px;
  overflow:hidden;isolation:isolate;
  box-shadow:0 50px 90px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(241,247,244,.12)}
.plate .who{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;will-change:transform,filter,clip-path}
.plate .who.on{opacity:1}
.plate .who svg{width:100%;height:100%;display:block}
.plate .who img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}

/* hiệu ứng NHIỄU khi đổi người */
@keyframes slice{
  0%  {clip-path:inset(0 0 88% 0);transform:translateX(-16px) scaleY(1.02)}
  10% {clip-path:inset(76% 0 2% 0);transform:translateX(14px)}
  20% {clip-path:inset(20% 0 62% 0);transform:translateX(-11px)}
  32% {clip-path:inset(54% 0 24% 0);transform:translateX(10px)}
  44% {clip-path:inset(6% 0 80% 0);transform:translateX(-7px)}
  56% {clip-path:inset(36% 0 44% 0);transform:translateX(6px)}
  70% {clip-path:inset(0 0 0 0);transform:translateX(-3px)}
  100%{clip-path:inset(0 0 0 0);transform:none}
}
@keyframes fringe{
  0%,70%{filter:drop-shadow(4px 0 0 rgba(255,40,90,.75)) drop-shadow(-4px 0 0 rgba(0,225,255,.75)) saturate(1.5)}
  100%  {filter:none}
}
.plate.glitching .who.on{animation:slice .5s linear, fringe .5s linear}
.scan{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.16) 0 1px,transparent 1px 4px)}
@keyframes scanflash{0%{opacity:.85}60%{opacity:.35}100%{opacity:0}}
.plate.glitching .scan{animation:scanflash .5s linear}
/* khung viền + nhãn tên */
.plate-name{position:absolute;left:50%;bottom:-56px;translate:-50% 0;z-index:6;text-align:center;
  width:max-content;max-width:min(88vw,440px);line-height:1.6;
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;opacity:.62;transition:opacity .3s}
.plate-name b{display:block;font-size:15px;letter-spacing:.1em;margin-bottom:5px;opacity:.95;font-weight:400}

/* ---- CÁC MỤC QUANH NGƯỜI ---- */
.node{position:absolute;display:flex;flex-direction:column;gap:5px;padding:13px 17px;border-radius:15px;
  background:rgba(255,255,255,.045);border:1px solid rgba(241,247,244,.14);backdrop-filter:blur(10px);
  cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:184px;
  transition:transform .5s cubic-bezier(.2,.9,.25,1),background .4s,border-color .4s,box-shadow .5s}
.node .kicker{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.5}
.node .label{font-size:15.5px;letter-spacing:.03em}
.node .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 26%,transparent);top:50%;translate:0 -50%;transition:scale .4s}
.node[data-side="l"] .dot{right:-22px}
.node[data-side="r"] .dot{left:-22px}
.node:hover,.node:focus-visible{outline:none;
  background:color-mix(in srgb,var(--c) 20%,rgba(255,255,255,.05));
  border-color:color-mix(in srgb,var(--c) 58%,transparent);
  box-shadow:0 14px 40px -12px color-mix(in srgb,var(--c) 60%,transparent)}
.node[data-side="l"]:hover{transform:translateX(-9px)}
.node[data-side="r"]:hover{transform:translateX(9px)}
.node:hover .dot{scale:1.5}
.node::before{content:"";position:absolute;top:50%;height:1px;width:0;opacity:.75;
  background:linear-gradient(var(--dir,to right),var(--c),transparent);
  transition:width .55s cubic-bezier(.2,.9,.25,1)}
.node[data-side="l"]::before{right:-22px;--dir:to right}
.node[data-side="r"]::before{left:-22px;--dir:to left}
.node:hover::before{width:clamp(28px,6vw,88px)}

.scrollhint{position:absolute;bottom:22px;right:clamp(18px,4vw,52px);z-index:15;
  font-size:9px;letter-spacing:.28em;text-transform:uppercase;opacity:.5;
  display:flex;flex-direction:column;align-items:center;gap:9px}
.scrollhint i{display:block;width:1px;height:32px;background:linear-gradient(#f1f7f4,transparent);
  animation:drop 2.2s ease-in-out infinite}
@keyframes drop{0%,100%{opacity:.15;transform:scaleY(.5);transform-origin:top}50%{opacity:.8;transform:scaleY(1)}}

/* ==================================================================
   TRANG SẢN PHẨM — mỗi nhóm một trang riêng, theo ngôn ngữ ROOTLAB
   ================================================================== */
section.prod{position:relative;min-height:100svh;overflow:hidden;display:grid;place-items:center;
  padding:clamp(70px,9vh,110px) clamp(20px,5vw,70px);
  background:radial-gradient(125% 95% at 50% 40%,var(--g1) 0%,var(--g2) 38%,var(--g3) 100%);
  color:var(--fg)}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff8,var(--acc) 42%,transparent 72%);
  filter:blur(.4px);opacity:.62;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.leaf{position:absolute;width:120px;height:190px;opacity:.13;
  background:var(--acc);border-radius:0 100% 0 100%;transform:rotate(var(--r,20deg))}

.prod-grid{position:relative;z-index:3;width:min(1240px,100%);display:grid;
  grid-template-columns:1fr 1.05fr .78fr;gap:clamp(20px,3.4vw,54px);align-items:center}
.prod.flip .prod-grid{grid-template-columns:.78fr 1.05fr 1fr}
.prod.flip .copy{order:3}.prod.flip .side{order:1}
/* kiểu "giữa trang": chữ ở trên, hàng dưới là chai + 2 thẻ nằm ngang → vừa 1 màn */
.prod.center .prod-grid{max-width:900px;gap:clamp(14px,3vh,34px) 40px;justify-items:center;
  align-items:center;text-align:center;
  grid-template-columns:auto auto;
  grid-template-areas:"copy copy" "bottle side"}
.prod.center .copy{grid-area:copy}
.prod.center .bottlewrap{grid-area:bottle}
.prod.center .side{grid-area:side;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.prod.center h2{font-size:clamp(36px,5vw,70px);margin-bottom:14px}
.prod.center p.lead{margin:0 auto 20px}
.prod.center .bottle:not(.mini){width:clamp(96px,10.5vw,142px);animation-duration:7s}
.prod.center .bottle:not(.mini) .cap{height:34px}
.bottle.mini{width:100%;animation:none;filter:none}
.bottle.mini .cap{height:12px;border-radius:3px}
.bottle.mini .neck{height:4px}
.prod.center .step{margin-bottom:14px}
.prod.center .pcard{padding:14px 18px}

.step{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;opacity:.75;margin-bottom:22px}
.step::before{content:"";width:38px;height:1px;background:currentColor;opacity:.6}
.prod h2{margin:0 0 24px;font-size:clamp(46px,7.2vw,104px);line-height:.86;letter-spacing:-.01em}
.prod h2 em{display:block;font-style:italic;color:var(--acc)}
.prod p.lead{margin:0 0 32px;font-size:clamp(14px,1.5vw,17px);line-height:1.72;opacity:.8;max-width:42ch}
.cta{display:inline-flex;align-items:center;gap:16px;padding:15px 15px 15px 30px;border-radius:999px;
  background:var(--ink);color:var(--fg);border:0;cursor:pointer;font:inherit;font-size:15px;
  transition:.35s;text-decoration:none}
.cta i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;
  background:var(--acc);color:var(--ink);font-style:normal;font-size:17px;transition:.35s}
.cta:hover{transform:translateY(-3px);box-shadow:0 16px 34px -14px var(--acc)}
.cta:hover i{rotate:90deg}

/* ---- CHAI CSS ---- */
.bottlewrap{display:grid;place-items:center;perspective:900px}
.bottle{position:relative;width:clamp(150px,17vw,225px);filter:drop-shadow(0 40px 46px rgba(0,0,0,.45));
  animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bottle .cap{width:44%;height:52px;margin:0 auto;border-radius:7px 7px 3px 3px;background:var(--cap);
  background-image:linear-gradient(90deg,rgba(0,0,0,.4),transparent 24%,rgba(255,255,255,.28) 46%,transparent 72%,rgba(0,0,0,.42))}
.bottle .neck{width:30%;height:15px;margin:0 auto;background:var(--body);
  background-image:linear-gradient(90deg,rgba(0,0,0,.22),transparent 30%,rgba(255,255,255,.5) 50%,transparent 74%,rgba(0,0,0,.24))}
.bottle .body{border-radius:16px 16px 22px 22px;padding:26px 14px 20px;background:var(--body);
  background-image:linear-gradient(90deg,rgba(0,0,0,.2),transparent 20%,rgba(255,255,255,.55) 44%,transparent 72%,rgba(0,0,0,.24));
  aspect-ratio:var(--ar,.52);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  text-align:center;color:var(--bink)}
.bottle .bname{font-size:8px;letter-spacing:.34em;opacity:.65}
.bottle .l1,.bottle .l2{font-size:clamp(17px,2.1vw,27px);line-height:.96;letter-spacing:.02em;font-weight:500}
.bottle .sub{font-size:7.5px;letter-spacing:.18em;opacity:.72;margin-top:5px;
  border-top:1px solid currentColor;border-bottom:1px solid currentColor;padding:5px 0;width:88%}
.bottle .vn{font-size:8px;opacity:.62;line-height:1.4}
.bottle .vol{font-size:9px;letter-spacing:.16em;opacity:.55;margin-top:5px}

/* ---- thẻ sản phẩm phụ ---- */
.side{display:grid;gap:14px}
.pcard{padding:20px 16px;border-radius:16px;text-align:center;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);
  background:color-mix(in srgb,var(--fg) 5%,transparent);transition:.4s}
.pcard:hover{transform:translateY(-5px);border-color:var(--acc);
  background:color-mix(in srgb,var(--acc) 14%,transparent)}
.pcard .mini{width:38px;margin:0 auto 12px}
.pcard .mini .cap{height:12px;border-radius:3px}
.pcard .mini .neck{height:4px}
.pcard .mini .body{aspect-ratio:.5;border-radius:5px;padding:0}
.pcard b{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
.pcard span{font-size:10px;opacity:.62}

.badge{position:absolute;left:clamp(20px,5vw,64px);bottom:clamp(22px,5vh,50px);z-index:4;
  display:flex;align-items:center;gap:13px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.82}
.badge i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-style:normal;
  border:1px solid color-mix(in srgb,var(--fg) 32%,transparent)}
.badge b{display:block;font-weight:400;opacity:.62;font-size:8.5px;margin-bottom:3px}
.bigscript{position:absolute;right:clamp(14px,3vw,44px);bottom:clamp(6px,2vh,26px);z-index:2;
  font-size:clamp(48px,8.6vw,124px);line-height:.82;text-align:right;color:var(--fg);opacity:.17;pointer-events:none}
.backtop{position:absolute;right:clamp(20px,5vw,60px);top:clamp(22px,4vh,44px);z-index:6;
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);
  background:none;border:0;cursor:pointer;font-family:inherit;opacity:.8}
.backtop:hover{opacity:1}
.reveal{opacity:0;transform:translateY(26px);
  transition:opacity .9s cubic-bezier(.2,.9,.25,1),transform .9s cubic-bezier(.2,.9,.25,1)}
.reveal.in{opacity:1;transform:none}

/* ---- ĐIỆN THOẠI ---- */
@media (max-width:920px){
  .stage{height:auto;padding:86px 0 100px;display:flex;flex-direction:column;gap:20px}
  .plate-wrap,#nodes{grid-area:auto}
  .plate{width:min(66vw,300px)}
  .plate-name{position:static;translate:none;margin-top:16px}
  #nodes{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;width:min(560px,92vw);margin-top:34px}
  .node{position:static!important;width:100%;min-width:0;padding:12px 14px;transform:none!important}
  .node .dot,.node::before{display:none}
  .scrollhint{display:none}
  .prod-grid,.prod.flip .prod-grid{grid-template-columns:1fr!important;gap:26px;justify-items:center;text-align:center}
  .prod .copy,.prod .side{order:unset!important}
  .prod p.lead{margin-inline:auto}
  .side{grid-template-columns:1fr 1fr;width:100%;max-width:420px}
  .bigscript{font-size:15vw;opacity:.1}
  .badge{position:static;justify-content:center;margin-top:26px}
}
</style>
</head>
<body>

<div class="demo-flag">Bản thử · đã gắn ảnh thật</div>

<!-- ============ MÀN ĐẦU ============ -->
<header class="hero" id="top">
  <div class="brandbar">
    <div class="brand">ROOTLAB<small>HAIR LABORATORY</small></div>
    <div class="tag">Rê chuột vào từng nhóm</div>

    <div class="plate-wrap">
      <!-- ★ CHỖ ĐẶT ẢNH NGƯỜI THẬT — xem ghi chú cuối file -->
      <div class="plate" id="plate">

      <div class="plate-name" id="pname"><b>—</b><span>—</span></div>
    </div>
    <div id="nodes"></div>
  </div>

  <div class="scrollhint"><span>Bấm vào một nhóm</span><i></i></div>
</header>

<main id="sections"></main>

/* ==================================================================
   3. DỰNG MÀN ĐẦU
   ================================================================== */
const plate = document.getElementById('plate');
const pname = document.getElementById('pname');
const nodesBox = document.getElementById('nodes');
const hero = document.querySelector('.hero');

CATS.forEach((cat,i)=>{
  const d = document.createElement('div');
  d.className = 'who'; d.dataset.key = cat.key;
  // Ảnh thật. Nếu thiếu file ảnh → tự quay về hình bóng mẫu, không vỡ trang.
  d.innerHTML = `<img src="${cat.key}.jpg" alt="${cat.label}">`;
  d.querySelector('img').addEventListener('error',()=>{ d.innerHTML = personSVG(cat.model); });
  plate.insertBefore(d, plate.firstChild);
});
const POS=[['l',14,20],['l',5,50],['l',14,80],['r',14,20],['r',5,50],['r',14,80]];
const order=[0,2,4,1,3,5];
CATS.forEach((cat,i)=>{
  const [side,x,y]=POS[order.indexOf(i)];
  const b=document.createElement('button');
  b.className='node'; b.dataset.side=side; b.dataset.key=cat.key;
  b.style.setProperty('--c',cat.c);
  b.style.top=y+'%'; b.style.translate='0 -50%';
  if(side==='l') b.style.left=x+'%'; else b.style.right=x+'%';
  b.innerHTML=`<span class="kicker">${cat.kicker}</span><span class="label">${cat.label}</span><span class="dot"></span>`;
  nodesBox.appendChild(b);
});

/* ---- ĐỔI NGƯỜI + HIỆU ỨNG NHIỄU ---- */
let currentKey=null, busy=false;
function showPerson(key){
  if(key===currentKey || busy) return;
  const cat=CATS.find(c=>c.key===key); if(!cat) return;
  busy=true; currentKey=key;

  plate.querySelectorAll('.who').forEach(w=>w.classList.toggle('on', w.dataset.key===key));
  plate.classList.remove('glitching'); void plate.offsetWidth; plate.classList.add('glitching');

  pname.style.opacity=0;
  setTimeout(()=>{
    pname.innerHTML=`<b>${cat.model.name}</b><span>${cat.model.note}</span>`;
    pname.style.opacity=.62;
  },230);

  hero.style.background=
    `radial-gradient(120% 92% at 50% 44%, ${cat.model.bg1} 0%, ${cat.page.g2} 34%, #011411 76%)`;

  setTimeout(()=>{ plate.classList.remove('glitching'); busy=false; },520);
}
showPerson(CATS[0].key);

document.querySelectorAll('.node').forEach(n=>{
  n.addEventListener('mouseenter',()=>showPerson(n.dataset.key));
  n.addEventListener('focus',()=>showPerson(n.dataset.key));
  n.addEventListener('click',()=>goTo(n.dataset.key));
});

/* điện thoại: không có rê chuột → tự đảo người */
const noHover=window.matchMedia('(hover: none)').matches;
if(noHover){
  document.querySelector('.brandbar .tag').textContent='Chạm vào từng nhóm';
  let i=1; setInterval(()=>{ showPerson(CATS[i++%CATS.length].key); },2800);
}

/* ---- tự lướt xuống ---- */
function goTo(key){
  const el=document.getElementById('sec-'+key); if(!el) return;
  const start=window.scrollY, dist=el.offsetTop-start;
  const dur=Math.min(1500,640+Math.abs(dist)*.26); let t0=null;
  const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  (function step(ts){ if(t0===null)t0=ts;
    const p=Math.min(1,(ts-t0)/dur);
    window.scrollTo(0,start+dist*ease(p));
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}

/* ==================================================================
   4. DỰNG 6 TRANG SẢN PHẨM RIÊNG
   ================================================================== */
function bottleHTML(b,mini){
  return `<div class="bottle ${mini?'mini':''}" style="--body:${b.body};--cap:${b.cap};--bink:${b.ink};--ar:${b.ar||.52}">
    <div class="cap"></div><div class="neck"></div>
    <div class="body">${mini?'':`
      <div class="bname">ROOTLAB</div>
      <div class="l1">${b.l1}</div><div class="l2">${b.l2}</div>
      <div class="sub">${b.sub}</div>
      <div class="vn">${b.vn}</div>
      <div class="vol">${b.vol}</div>`}
    </div></div>`;
}
const main=document.getElementById('sections');
CATS.forEach((cat,idx)=>{
  const p=cat.page;
  const s=document.createElement('section');
  s.className='prod '+(p.lay||''); s.id='sec-'+cat.key;
  s.style.cssText=`--g1:${p.g1};--g2:${p.g2};--g3:${p.g3};--fg:${p.fg};--acc:${p.acc};--ink:${p.ink}`;

  const orbs=[[58,'8%','18%',0],[34,'86%','30%',1.4],[46,'12%','74%',2.6],[24,'78%','82%',.8],[30,'62%','12%',3.4]]
    .map(([sz,l,t,d])=>`<div class="orb" style="width:${sz}px;height:${sz}px;left:${l};top:${t};animation-delay:${d}s"></div>`).join('');
  const leaves=[[ '4%','30%',18],['88%','16%',-42],['72%','70%',124]]
    .map(([l,t,r])=>`<div class="leaf" style="left:${l};top:${t};--r:${r}deg"></div>`).join('');

  s.innerHTML=`
    <div class="deco">${orbs}${leaves}</div>
    <button class="backtop">↑ Về màn đầu</button>
    <div class="prod-grid">
      <div class="copy">
        <div class="step reveal">${p.step}</div>
        <h2 class="reveal serif">${p.t1}<em class="script">${p.t2}</em></h2>
        <p class="lead reveal">${p.lead}</p>
        <div class="reveal"><button class="cta">${p.cta}<i>+</i></button></div>
      </div>
      <div class="bottlewrap reveal">${bottleHTML(p.bottle)}</div>
      <aside class="side">
        ${p.cards.map(([n,sub,body,cap,ink])=>`
          <div class="pcard reveal">
            <div class="mini">${bottleHTML({body,cap,ink},true)}</div>
            <b>${n}</b><span>${sub}</span>
          </div>`).join('')}
      </aside>
    </div>
    <div class="badge"><i>${p.badgeI}</i><div><b>${p.badgeT}</b>${p.badgeS}</div></div>
    <div class="bigscript script">${p.big}</div>`;
  main.appendChild(s);
});

document.querySelectorAll('.backtop').forEach(b=>b.addEventListener('click',()=>{
  const start=window.scrollY; let t0=null; const ease=p=>1-Math.pow(1-p,3);
  (function step(ts){ if(t0===null)t0=ts;
    const p=Math.min(1,(ts-t0)/900);
    window.scrollTo(0,start*(1-ease(p)));
    if(p<1) requestAnimationFrame(step);
  })(performance.now());
}));

const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}),{threshold:.12});
document.querySelectorAll('.reveal').forEach((el,i)=>{
  el.style.transitionDelay=(i%7*70)+'ms'; io.observe(el);
});
